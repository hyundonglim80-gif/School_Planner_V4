<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    
    <!-- 아이콘 경로는 상대경로(./) 사용 -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    
    <!-- 매니페스트 경로 상대경로(./) 원상 복구 -->
    <link rel="manifest" href="./manifest.json" />
    
    <!-- 예전에는 width=1200으로 고정해 PC 레이아웃을 그린 뒤 브라우저가 화면 너비에 맞게
         축소해 보여줬다. 그래서 휴대폰에서는 글씨가 잘게 줄어들어 핀치줌 없이는 읽기 어려웠고,
         코드에 깔린 sm:/md:/lg: 반응형 클래스가 단 하나도 발동하지 않았다(레이아웃 뷰포트가
         항상 1200px이므로). device-width로 바꿔 화면 폭 그대로 그리고, 좁은 화면 전용
         레이아웃(하단 탭바, 월간 아젠다 뷰)을 따로 둔다.
         viewport-fit=cover는 하단 탭바가 제스처 바에 가리지 않도록 safe-area 값을 쓰기 위함이다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />
    <meta name="theme-color" content="#2563eb" />
    <title>School Planner V4</title>
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // 🚨 핵심 수정: /sw.js 가 아니라 ./sw.js 로 원상 복구! (이것 때문에 설치가 안 됨)
          navigator.serviceWorker.register('./sw.js').catch(err => {
            console.log('[SP4] Service Worker 등록 실패:', err);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
