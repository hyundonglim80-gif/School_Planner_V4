<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    
    <!-- 아이콘 경로는 상대경로(./) 사용 -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    
    <!-- 매니페스트 경로 상대경로(./) 원상 복구 -->
    <link rel="manifest" href="./manifest.json" />
    
    <!-- PC와 동일한 가로 레이아웃(1280px)을 유지하고, 좁은 화면에서는 배율을 축소해 한 페이지에 담습니다. -->
    <!-- initial-scale을 지정하지 않아야 브라우저가 화면 너비에 맞게 자동으로 축소 배율을 계산하며, -->
    <!-- user-scalable=yes + maximum-scale 지정 안 함으로 핀치줌 확대는 계속 가능합니다. -->
    <meta name="viewport" content="width=1280, user-scalable=yes" />
    <meta name="theme-color" content="#2563eb" />
    <title>School Planner V4</title>
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // 🚨 핵심 수정: /sw.js 가 아니라 ./sw.js 로 원상 복구! (이것 때문에 설치가 안 됨)
          navigator.serviceWorker.register('./sw.js').catch(err => {
            console.log('[SP4] Service Worker 등록 실패:', err);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
